<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Sanctuary For Your Heart 🌸</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f4efe6;
            --card-bg: rgba(255, 255, 255, 0.94);
            --primary: #9c6644;
            --primary-hover: #7f4f24;
            --accent: #b08968;
            --text-main: #1a1a1a;
            --text-muted: #6f6f6f;
            --error: #d90429;
            --radius: clamp(20px, 4vw, 32px);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: clamp(15px, 3vw, 40px);
            overflow-x: hidden;
            position: relative;
        }

        /* Background Animated Ambient Orbs */
        .ambient-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            z-index: -1;
            opacity: 0.5;
            animation: floatOrb 12s infinite alternate ease-in-out;
        }

        .orb-1 {
            width: clamp(250px, 40vw, 450px);
            height: clamp(250px, 40vw, 450px);
            background: #e6ccb2;
            top: -50px;
            left: -50px;
        }

        .orb-2 {
            width: clamp(300px, 45vw, 500px);
            height: clamp(300px, 45vw, 500px);
            background: #ddb892;
            bottom: -50px;
            right: -50px;
            animation-delay: -4s;
        }

        @keyframes floatOrb {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(40px) scale(1.1); }
        }

        .container {
            background-color: var(--card-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            padding: clamp(25px, 6vw, 60px);
            border-radius: var(--radius);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.08);
            max-width: 1000px;
            width: 100%;
            text-align: center;
            animation: cardEntrance 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            margin: auto;
        }

        @keyframes cardEntrance {
            from { opacity: 0; transform: translateY(30px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        h1 {
            color: var(--primary);
            font-size: clamp(24px, 4vw, 36px);
            font-weight: 700;
            margin-bottom: clamp(10px, 2vw, 18px);
            letter-spacing: -0.5px;
        }

        p.intro-text {
            color: var(--text-muted);
            font-size: clamp(14px, 2vw, 18px);
            margin-bottom: clamp(20px, 4vw, 40px);
            line-height: 1.7;
        }

        .input-group {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        input[type="password"] {
            padding: clamp(12px, 2vw, 18px) clamp(16px, 3vw, 28px);
            border: 2px solid #e3d5ca;
            border-radius: 18px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: clamp(18px, 3vw, 22px);
            outline: none;
            width: min(100%, 350px);
            letter-spacing: 6px;
            text-align: center;
            background: #fff;
            color: var(--text-main);
            transition: all 0.3s ease;
        }

        input[type="password"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 6px rgba(156, 102, 68, 0.12);
        }

        button {
            padding: clamp(12px, 2vw, 18px) clamp(20px, 3vw, 35px);
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 18px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 600;
            font-size: clamp(15px, 2vw, 18px);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 25px rgba(156, 102, 68, 0.25);
            white-space: nowrap;
        }

        button:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(127, 79, 36, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .error-msg {
            color: var(--error);
            font-size: clamp(13px, 1.5vw, 15px);
            font-weight: 500;
            margin-top: 12px;
            display: none;
            animation: shake 0.4s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }

        /* Message Screen Styling */
        #message-box {
            display: none;
            text-align: left;
            animation: fadeInContent 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeInContent {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        #greeting-title {
            text-align: center;
            margin-bottom: clamp(20px, 4vw, 35px);
            font-size: clamp(26px, 4.5vw, 40px);
            color: var(--primary);
            font-weight: 800;
        }

        #message-content {
            background: rgba(255, 255, 255, 0.98);
            padding: clamp(20px, 5vw, 55px);
            border-radius: 24px;
            border-left: clamp(5px, 1vw, 8px) solid var(--primary);
            font-size: clamp(15px, 2vw, 19px);
            line-height: 2.1;
            color: var(--text-main);
            font-weight: 600;
            margin-bottom: clamp(20px, 4vw, 40px);
            box-shadow: 0 12px 35px rgba(0,0,0,0.04);
            max-height: 60vh;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: var(--accent) transparent;
        }

        #message-content::-webkit-scrollbar {
            width: 6px;
        }

        #message-content::-webkit-scrollbar-thumb {
            background-color: var(--accent);
            border-radius: 10px;
        }

        #message-content p {
            margin-bottom: clamp(16px, 3vw, 28px);
            text-align: justify;
        }

        #message-content p:last-child {
            margin-bottom: 0;
        }

        .back-btn {
            background-color: var(--accent);
            width: 100%;
            padding: clamp(14px, 2vw, 18px);
            font-size: clamp(16px, 2vw, 18px);
            box-shadow: none;
        }

        .back-btn:hover {
            background-color: var(--primary);
        }
    </style>
</head>
<body>

    <div class="ambient-orb orb-1"></div>
    <div class="ambient-orb orb-2"></div>

    <div class="container">
        <div id="login-view">
            <h1>✨ A Sanctuary For Your Heart ✨</h1>
            <p class="intro-text">Enter your unique 6-digit passcode below to open your personal letter.</p>
            <div class="input-group">
                <input type="password" id="passwordInput" placeholder="••••••" maxlength="6" autocomplete="off">
                <button onclick="checkPassword()">Open Letter</button>
            </div>
            <div id="errorMsg" class="error-msg">That passcode doesn't quite match. Please double-check and try again. 💛</div>
        </div>

        <div id="message-box">
            <h1 id="greeting-title"></h1>
            <div id="message-content"></div>
            <button class="back-btn" onclick="lockScreen()">Lock & Return Home</button>
        </div>
    </div>

    <script>
        const messages = {
            "482910": {
                name: "Dear Solis 💛",
                text: `<p>First of all, I want to take a slow, deliberate moment to talk about your confidence. It is one of the most striking, radiant, and remarkable things about you. You carry yourself with an inner strength and an effortless grace that naturally commands a room and leaves an inspiring impression on everyone around you, even during moments when you might doubt yourself. It is a rare, magnetic kind of energy, and I want you to know how deeply I admire it.</p>
                       <p>That being said, I need to address the past, and I want to apologize to you from the very deepest, truest part of my heart for leaving. The plain and honest truth is that I was terrified. I was running entirely on fear—paralyzed by old trauma, heavy internal wounds, and emotional baggage that I didn't yet know how to navigate, process, or heal. Instead of standing firm like I should have, or communicating with the maturity you deserved, I let panic dictate my actions, and I walked away from a connection that meant a great deal to me. Carrying the weight of that choice has been heavy because you deserved someone who stayed and fought through the storm, rather than someone who turned and ran.</p>
                       <p>I want you to know that my perspective has shifted, and I am choosing to show up for you now without hesitation. I am completely and unconditionally here for you. Whenever life gets overwhelming, when the noise of the world becomes too loud, or if the sheer weight of everything feels entirely too heavy to carry on your own shoulders, I want you to bring it to me. Rant to me. Let out every single frustration, every grievance, every ounce of exhaustion, and every messy thought. Never hold anything inside or try to keep up a strong front for my sake. My ears, my time, and my heart are permanently open to your rants and feelings without a shred of judgment.</p>
                       <p>Beyond all of that, I want to take a moment to remind you of just how breathtakingly gorgeous you are. Every single look you put together has a unique magic to it, and I am continually amazed by all the different hairstyles you rock. Whether you are switching up your aesthetic completely or keeping it simple and casual, you pull every single look off with absolute perfection. Thank you for being who you are, Solis. I am deeply sorry for walking away, but please know I am right here now.</p>`
            },
            "739182": {
                name: "Dearest Sabrina 🌷",
                text: `<p>My wonderful, cherished little sister, I want to take a long, quiet moment to remind you just how deeply important you are in my life. You bring a specific kind of brightness, laughter, and genuine warmth into my days that completely shifts the atmosphere. Having a bond with you is something I treasure far more than words can easily capture, and watching you navigate life, grow, and tackle your dreams makes me endlessly proud.</p>
                       <p>I want to make a permanent, unwavering promise to you right here and right now: no matter what situation we find ourselves facing—whether life is smooth sailing or stormy, whether things are wonderfully calm or incredibly difficult—I will always be right by your side. You are never, under any circumstances, going to have to walk through life's hardships alone. If the world feels like it's tilting off its axis or things get heavy, you can always look over and know I'm standing right there with you, ready to weather whatever comes our way.</p>
                       <p>You are also, without a single doubt, my absolute favorite ranting buddy. I live for our unfiltered conversations, our late-night venting sessions where we solve or completely overthink the entire universe, and the effortless way we can share our true thoughts with one another without fear of being judged. You get my weirdness, I get yours, and that safe space we've built together is utterly priceless. Thank you for always keeping it real, for being such a brilliant light, and for being the kind of younger sister anyone would dream of having. I've got your back forever, through thick and thin, no matter what.</p>`
            },
            "193847": {
                name: "Dear Evangelica 🌿",
                text: `<p>I want to take this space to tell you how deeply I care about you, and how much I genuinely cherish the times we spend together. There is a quiet, steady comfort in your presence that brings a profound sense of peace to my chaotic mind, and I always look forward to sharing moments with you.</p>
                       <p>At the same time, I need to look you in the eyes—metaphorically speaking—and say I am truly, deeply sorry for leaving before. It was an abrupt and hurtful thing to do, and it created a distance between us that shouldn't have been there. But more than anything, I want to make sure you know with absolute certainty: I am not mad at you at all. Not even a fraction of a percent. It had zero to do with you, your actions, or anything you said or didn't say. The fault was entirely my own—my own internal battles, my unresolved fears, and the messy walls I had built around myself that I didn't know how to tear down properly.</p>
                       <p>You did nothing wrong, and my leaving was purely a reflection of my own internal storms and unhealed parts. I value you far too much to ever want you carrying any false guilt or wondering if you played a part in it. Thank you for your patience, your grace, and your enduring kindness. I hope that moving forward, we can always share this quiet warmth and peace together, knowing that my appreciation for you has never wavered and never will.</p>`
            },
            "562093": {
                name: "Dear Bea ✨",
                text: `<p>I wanted to pause everything for a quiet, intentional moment to say a massive, heartfelt thank you to you. In a world where everyone is constantly rushing, spinning plates, and wrapped up in their own busy, chaotic lives, the simple fact that you take time out of your day to think about me means more than words can ever truly articulate.</p>
                       <p>Knowing that I cross your mind, that you check in, or that you keep me in your thoughts shows the depth of your character. It proves just how genuinely kind, empathetic, and compassionate your heart is. Your thoughtfulness doesn't go unnoticed—it acts like a sudden ray of sunlight breaking through heavy clouds on a gray afternoon. It grounds me, reminds me that I matter, and brings an immense sense of comfort to my spirit when I need it most.</p>
                       <p>Your gentle soul is such a rare and precious gift to everyone lucky enough to cross paths with you. Thank you for being so consistently thoughtful, for caring so deeply, and for simply existing as such a wonderful, grounding presence in this world. I appreciate you more than you will ever fully know, and I hope this note brings a fraction of the warmth you so freely give to others.</p>`
            }
        };

        function checkPassword() {
            const inputVal = document.getElementById("passwordInput").value.trim();
            const errorMsg = document.getElementById("errorMsg");

            if (messages[inputVal]) {
                document.getElementById("login-view").style.display = "none";
                document.getElementById("message-box").style.display = "block";
                document.getElementById("greeting-title").innerText = messages[inputVal].name;
                document.getElementById("message-content").innerHTML = messages[inputVal].text;
                document.getElementById("passwordInput").value = "";
                errorMsg.style.display = "none";
            } else {
                errorMsg.style.display = "block";
                errorMsg.style.animation = 'none';
                errorMsg.offsetHeight; 
                errorMsg.style.animation = 'shake 0.4s ease-in-out';
            }
        }

        document.getElementById("passwordInput").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                checkPassword();
            }
        });

        function lockScreen() {
            document.getElementById("message-box").style.display = "none";
            document.getElementById("login-view").style.display = "block";
        }
    </script>

</body>
</html>
